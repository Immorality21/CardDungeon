<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- The game fills the page on every device: no zooming, no scrolling, and under the notch
         only when the browser says it is safe (viewport-fit + the safe-area padding below). -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0614;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #0b0614;
        outline: none;
      }
      #loading {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(60vw, 420px);
        font: 600 16px/1.4 system-ui, sans-serif;
        color: #d9c7ff;
        text-align: center;
      }
      #loading-bar {
        margin-top: 10px;
        height: 10px;
        border: 2px solid #7a3fc4;
        border-radius: 6px;
        overflow: hidden;
      }
      #loading-fill {
        width: 0%;
        height: 100%;
        background: #c86bff;
      }
      #message {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: 90vw;
        padding: 10px 16px;
        border-radius: 8px;
        background: rgba(80, 10, 20, 0.92);
        color: #fff;
        font: 14px/1.4 system-ui, sans-serif;
        display: none;
      }
      /* A phone held upright gets a prompt to turn it: the game is laid out for landscape. */
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: #0b0614;
        color: #d9c7ff;
        font: 600 20px/1.4 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        z-index: 10;
      }
      #rotate .icon {
        width: 46px;
        height: 76px;
        border: 4px solid #c86bff;
        border-radius: 10px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (max-width: 900px) {
        body.touch #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div>{{{ PRODUCT_NAME }}}</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
      </div>
      <div id="message"></div>
    </div>
    <div id="rotate">
      <div class="icon"></div>
      <div>Turn your phone sideways to play</div>
    </div>
    <script>
      var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      if (isTouch) {
        document.body.classList.add('touch');
      }

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var message = document.querySelector("#message");

      function showMessage(text, type) {
        if (type === 'warning') {
          console.warn(text);
          return;
        }
        message.textContent = text;
        message.style.display = 'block';
        if (type !== 'error') {
          setTimeout(function () { message.style.display = 'none'; }, 6000);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showMessage,
      };

      // Phones report 3x pixel ratios; a pixel-art game gains nothing past 2x and pays for it in
      // frame rate and battery.
      if (isTouch) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          window.unityInstance = unityInstance;
        }).catch(function (error) {
          showMessage(String(error), 'error');
        });
      };
      document.body.appendChild(script);

      // Landscape lock where the browser allows it (Android Chrome, in full screen only); the
      // rotate prompt covers the rest.
      if (isTouch && screen.orientation && screen.orientation.lock) {
        document.addEventListener('fullscreenchange', function () {
          if (document.fullscreenElement) {
            screen.orientation.lock('landscape').catch(function () {});
          }
        });
      }
    </script>
  </body>
</html>
